name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      # Flux only redeploys on a manifest diff — floating :latest never
      # triggers a rollout by itself. Pin the manifest to the exact image
      # this job just built so every push actually reaches the cluster.
      #
      # Retries on push rejection: two workflow runs (e.g. two pushes close
      # together) can race to land their pin commit first. Re-fetching and
      # rebasing before each retry re-applies this job's own sed on top of
      # whatever landed in between, rather than failing outright.
      - name: Pin k8s manifest to this build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            sed -i "s#image: .*/fishbowl:.*#image: ${{ steps.image.outputs.name }}:${{ github.sha }}#" k8s/deployment.yaml

            if git diff --quiet k8s/deployment.yaml; then
              echo "manifest already pinned to this build"
              break
            fi

            git add k8s/deployment.yaml
            git commit -m "chore: pin fishbowl image to ${{ github.sha }} [skip ci]"

            if git push; then
              break
            fi

            echo "push rejected (attempt $attempt), rebasing onto latest main and retrying"
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
            sleep "$((RANDOM % 5 + 1))"
          done
