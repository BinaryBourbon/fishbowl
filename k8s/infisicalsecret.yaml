# Materializes Infisical project `agent-apps` / env `prod` / folder `/fishbowl`
# into the K8s Secret `fishbowl-secrets` that the Deployment reads.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: fishbowl-secrets
  namespace: default
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      identityId: 65877c19-830f-49dc-b524-45764ffc1e4b
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: agent-app-secrets
        namespace: default
      secretsScope:
        projectSlug: agent-apps-3-g3-h
        envSlug: prod
        secretsPath: "/fishbowl"
        recursive: false
  managedSecretReference:
    secretName: fishbowl-secrets
    secretNamespace: default
    creationPolicy: Orphan
